<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Error banner mockup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<p class="mockup-note">Hidden: nothing above the columns.</p>
<div class="mockup-frame">
  <div class="page" style="min-height: 0;">
    <div class="columns" style="padding-bottom: 0;"></div>
  </div>
</div>

<p class="mockup-note">An operation refused: its message.</p>
<div class="mockup-frame">
  <div class="page" style="min-height: 0;">
    <div class="banner">Title is empty.</div>
  </div>
</div>

<p class="mockup-note">No answer from the server.</p>
<div class="mockup-frame">
  <div class="page" style="min-height: 0;">
    <div class="banner">Server unreachable.</div>
  </div>
</div>

</body>
</html>
