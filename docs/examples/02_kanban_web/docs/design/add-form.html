<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add form mockup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<p class="mockup-note">Empty, with its placeholder.</p>
<div class="mockup-frame narrow">
  <div class="page" style="min-height: 0; padding: 16px;">
    <section class="column">
      <input class="field" placeholder="New card">
    </section>
  </div>
</div>

<p class="mockup-note">Focused, with text.</p>
<div class="mockup-frame narrow">
  <div class="page" style="min-height: 0; padding: 16px;">
    <section class="column">
      <input class="field focused" value="call the bank">
    </section>
  </div>
</div>

</body>
</html>
