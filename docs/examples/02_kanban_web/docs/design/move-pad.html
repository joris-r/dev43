<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Move pad mockup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<p class="mockup-note">Open on the top card of To do: up and left disabled.</p>
<div class="mockup-frame narrow">
  <div class="page" style="min-height: 0; padding: 16px 80px 16px 16px;">
    <section class="column">
      <div class="card selected">
        <span class="title">write tests</span>
        <button class="delete">×</button>
        <div class="pad">
          <button class="up" disabled>↑</button>
          <button class="left" disabled>←</button>
          <button class="right">→</button>
          <button class="down">↓</button>
        </div>
      </div>
      <div class="card">
        <span class="title">fix login bug</span>
        <button class="delete">×</button>
      </div>
    </section>
  </div>
</div>

<p class="mockup-note">Open on a middle card of Doing: every arrow enabled.</p>
<div class="mockup-frame narrow">
  <div class="page" style="min-height: 0; padding: 16px 80px 16px 16px;">
    <section class="column">
      <div class="card">
        <span class="title">set up the server</span>
        <button class="delete">×</button>
      </div>
      <div class="card selected">
        <span class="title">write the changelog</span>
        <button class="delete">×</button>
        <div class="pad">
          <button class="up">↑</button>
          <button class="left">←</button>
          <button class="right">→</button>
          <button class="down">↓</button>
        </div>
      </div>
      <div class="card">
        <span class="title">deploy</span>
        <button class="delete">×</button>
      </div>
    </section>
  </div>
</div>

</body>
</html>
