<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card mockup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<p class="mockup-note">A card: its title, then the delete button.</p>
<div class="mockup-frame narrow">
  <div class="page" style="min-height: 0; padding: 16px;">
    <section class="column">
      <div class="card">
        <span class="title">write tests</span>
        <button class="delete">×</button>
      </div>
    </section>
  </div>
</div>

<p class="mockup-note">A long title wraps; the button stays at the top.</p>
<div class="mockup-frame narrow">
  <div class="page" style="min-height: 0; padding: 16px;">
    <section class="column">
      <div class="card">
        <span class="title">review the pull request about the new export format before the release on Friday</span>
        <button class="delete">×</button>
      </div>
    </section>
  </div>
</div>

</body>
</html>
