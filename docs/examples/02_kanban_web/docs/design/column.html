<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Column mockup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<p class="mockup-note">To do, with the Add form and cards.</p>
<div class="mockup-frame narrow">
  <div class="page" style="min-height: 0; padding: 16px;">
    <section class="column">
      <h2>To do</h2>
      <input class="field" placeholder="New card">
      <div class="card">
        <span class="title">write tests</span>
        <button class="delete">×</button>
      </div>
      <div class="card">
        <span class="title">fix login bug</span>
        <button class="delete">×</button>
      </div>
    </section>
  </div>
</div>

<p class="mockup-note">Doing or Done, with cards: no Add form.</p>
<div class="mockup-frame narrow">
  <div class="page" style="min-height: 0; padding: 16px;">
    <section class="column">
      <h2>Doing</h2>
      <div class="card">
        <span class="title">set up the server</span>
        <button class="delete">×</button>
      </div>
    </section>
  </div>
</div>

<p class="mockup-note">Empty.</p>
<div class="mockup-frame narrow">
  <div class="page" style="min-height: 0; padding: 16px;">
    <section class="column">
      <h2>Done</h2>
    </section>
  </div>
</div>

</body>
</html>
