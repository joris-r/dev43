<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Board page mockup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<p class="mockup-note">The banner, then the three columns. Each component in one state; their states are in their own mockups.</p>
<div class="mockup-frame">
  <div class="page">
    <div class="banner">Title is empty.</div>
    <div class="columns">
      <section class="column">
        <h2>To do</h2>
        <input class="field" placeholder="New card">
        <div class="card">
          <span class="title">write tests</span>
          <button class="delete">×</button>
        </div>
        <div class="card">
          <span class="title">fix login bug</span>
          <button class="delete">×</button>
        </div>
      </section>
      <section class="column">
        <h2>Doing</h2>
        <div class="card">
          <span class="title">set up the server</span>
          <button class="delete">×</button>
        </div>
      </section>
      <section class="column">
        <h2>Done</h2>
        <div class="card">
          <span class="title">choose a name</span>
          <button class="delete">×</button>
        </div>
      </section>
    </div>
  </div>
</div>

</body>
</html>
